---
name: Coordination verification

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
      - name: Materialize locked coordinator quality environment
        run: uv sync --locked
      - name: Verify pinned coordinator release
        run: python3 tools/handoffctl_vendor.py verify --target .
      - name: Verify source policy
        run: python3 tools/check_source_headers.py
      - name: Scan public history for secrets
        run: tools/run_gitleaks.sh
      - name: Enforce Coordinator complexity budget
        run: |
          uv run lizard -l python --CCN 14 tools/handoffctl.py tools/assumption_revalidation.py tools/retry_circuit.py
      - name: Coordinator and policy failure tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify Git-backed state
        run: |
          tools/handoffctl doctor
          tools/handoffctl render-status --check
          test '"git"' = "$(python3 -c 'import json; print(json.dumps(json.load(open("coordinator.backend.json"))["backend"]))')"
          test -z "$(find . -path ./.git -prune -o -name 'coordinator.sqlite3*' -print -quit)"
          git diff --exit-code
      - name: Verify PR signatures and DCO
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/verify_commit_policy.py "$PR_BASE_SHA..$PR_HEAD_SHA"
